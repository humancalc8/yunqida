{% load static %}
<article class="product-card">

    <a class="product-media"
       href="{{ p.get_absolute_url }}"
       aria-label="View {{ p.name }}">

        {% if p.image %}
            <img src="{{ p.image.url }}"
                 alt="{{ p.name }}"
                 loading="lazy"
                 decoding="async">

        {% elif p.fallback_image %}
            <img src="{% if p.fallback_image|slice:':1' == '/' or p.fallback_image|slice:':4' == 'http' %}{{ p.fallback_image }}{% else %}{% static p.fallback_image %}{% endif %}"
                 alt="{{ p.name }}"
                 loading="lazy"
                 decoding="async">

        {% else %}
            <span class="product-media-empty">Image unavailable</span>
        {% endif %}

    </a>

    <h3 class="product-name">
        <a href="{{ p.get_absolute_url }}">{{ p.name }}</a>
    </h3>

    <a class="product-more" href="{{ p.get_absolute_url }}">
        <span class="product-more-text">View product</span>
        <span class="product-more-icon" aria-hidden="true">→</span>
    </a>

</article>
