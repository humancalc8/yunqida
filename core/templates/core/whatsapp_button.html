<style>
.yqwa{position:fixed;z-index:9990;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:0;height:58px;padding:0 17px;border-radius:999px;background:#25d366;color:#fff!important;text-decoration:none;font:700 1rem system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-shadow:0 10px 28px rgba(0,5,46,.28);transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s,gap .35s}
.yqwa svg{display:block;width:26px;height:26px;flex:0 0 26px;fill:currentColor}
.yqwa span{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .4s cubic-bezier(.16,1,.3,1),opacity .3s}
.yqwa:hover,.yqwa:focus-visible{gap:10px;transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,5,46,.34)}
.yqwa:hover span,.yqwa:focus-visible span{max-width:170px;opacity:1}
.yqwa:focus-visible{outline:3px solid #c4f135;outline-offset:3px}
.yqwa-card{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:46px;margin-top:12px;border:1.5px solid #128c4a;border-radius:999px;background:#fff;color:#0b6b37!important;font:700 .95rem system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-decoration:none;transition:background .3s,color .3s}
.yqwa-card svg{width:18px;height:18px;fill:currentColor}
.yqwa-card:hover{background:#25d366;border-color:#25d366;color:#fff!important}
@media(max-width:640px){.yqwa{height:54px;padding:0 14px}.yqwa:hover span{max-width:0;opacity:0}.yqwa:hover{gap:0}}
@media(prefers-reduced-motion:reduce){.yqwa,.yqwa span{transition:none}}
</style>

<a class="yqwa" id="yqWa" href="https://wa.me/254114542427" target="_blank" rel="noopener noreferrer" aria-label="Chat with Yunqida Energy Kenya on WhatsApp" data-product="{{ product_name|default:'' }}">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.38 4 15.01c0 2.12.55 4.18 1.6 6L4 29l8.2-1.56a12.03 12.03 0 0 0 3.84.62C22.68 28.06 28 22.66 28 16.03 28 9.4 22.68 3 16.04 3Zm0 22.02c-1.2 0-2.37-.3-3.4-.87l-.5-.28-4.86.92.95-4.72-.3-.52a9.1 9.1 0 0 1-1.4-4.84c0-5.03 4.1-9.1 9.12-9.1s9.1 4.07 9.1 9.1-4.07 9.1-9.1 9.1l.39.21Zm5-6.8c-.27-.14-1.62-.8-1.87-.9-.25-.09-.43-.14-.62.14-.18.27-.7.9-.86 1.08-.16.18-.32.2-.6.07-.27-.14-1.15-.42-2.2-1.35-.8-.72-1.35-1.6-1.5-1.87-.16-.28-.02-.43.12-.56.12-.12.27-.32.4-.48.14-.16.18-.27.27-.46.1-.18.05-.34-.02-.48-.07-.14-.62-1.5-.85-2.05-.22-.54-.45-.46-.62-.47h-.53c-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.29s.98 2.65 1.12 2.84c.14.18 1.93 2.95 4.68 4.13.65.28 1.16.45 1.56.58.66.2 1.25.18 1.72.11.52-.08 1.62-.66 1.85-1.3.23-.64.23-1.19.16-1.3-.07-.12-.25-.18-.52-.32Z"/></svg>
  <span>Chat on WhatsApp</span>
</a>

<script>
(function () {
  'use strict';
  var NUMBER = '254114542427';
  var ICON = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.38 4 15.01c0 2.12.55 4.18 1.6 6L4 29l8.2-1.56a12.03 12.03 0 0 0 3.84.62C22.68 28.06 28 22.66 28 16.03 28 9.4 22.68 3 16.04 3Z"/></svg>';

  /* keep only one floating button even if included twice */
  var all = document.querySelectorAll('#yqWa');
  for (var i = 1; i < all.length; i++) all[i].parentNode.removeChild(all[i]);

  function link(product) {
    var text = product
      ? 'Hello Yunqida Energy Kenya, I am interested in the ' + product + '. Please share the price, specifications and availability.'
      : 'Hello Yunqida Energy Kenya, I would like to enquire about your solar and lithium battery products. I am on the page: ' + document.title;
    return 'https://wa.me/' + NUMBER + '?text=' + encodeURIComponent(text);
  }

  var float = document.getElementById('yqWa');
  if (float) float.href = link((float.getAttribute('data-product') || '').trim());

  /* one WhatsApp button per product card, carrying that product name */
  document.querySelectorAll('.product-card').forEach(function (card) {
    if (card.querySelector('.yqwa-card')) return;
    var nameEl = card.querySelector('.product-name');
    var name = nameEl ? nameEl.textContent.replace(/\s+/g, ' ').trim() : '';
    if (!name) return;
    var a = document.createElement('a');
    a.className = 'yqwa-card';
    a.href = link(name);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', 'Enquire about ' + name + ' on WhatsApp');
    a.innerHTML = ICON + 'Enquire on WhatsApp';
    card.appendChild(a);
  });
})();
</script>
